<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>终端接入 - 赛博社畜</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: #1e1e1e;
      padding: 40px;
      border-radius: 10px;
      border: 1px solid #333;
      text-align: center;
      box-shadow: 0 0 20px rgba(33, 150, 243, 0.1);
    }
    h2 { color: #2196f3; margin-top: 0; }
    input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      border-radius: 5px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus { border-color: #2196f3; }
    button {
      width: 100%;
      padding: 12px;
      background: #4caf50;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #45a049; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>🔐 终端接入</h2>
    <p style="font-size: 12px; color: #888;">请输入你的赛博代号</p>
    <input type="text" id="username" placeholder="代号" />
    <button onclick="enterGame()">接入系统</button>
  </div>

  <script>
    function enterGame() {
      const username = document.getElementById('username').value.trim();
      if (!username) {
        alert('代号不能为空！');
        return;
      }
      // 把用户名存到浏览器的本地存储里
      localStorage.setItem('cyber_player_name', username);
      // 跳转到游戏主界面
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
